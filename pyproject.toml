[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "songline-math"
version = "0.1.0"
description = "Navigable knowledge graphs with persistent homology for data scientists"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "SuperInstance" },
]
keywords = ["graph", "topology", "persistent-homology", "knowledge-graph", "navigation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
